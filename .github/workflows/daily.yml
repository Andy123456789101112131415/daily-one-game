name: 🤖 每日AI造游戏

on:
  schedule:
    # 每天北京时间 7:00 (UTC 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  daily-game:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: pip install requests

      - name: 🤖 AI生成+自检修复
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TZ: Asia/Shanghai
        run: |
          git config --local user.name "Andy123456789101112131415"
          git config --local user.email "17717486751@163.com"
          python auto_game.py
